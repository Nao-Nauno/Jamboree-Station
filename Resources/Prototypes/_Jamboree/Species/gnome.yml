- type: species
  id: Gnome
  name: species-name-gnome
  prototype: MobGnome
  dollPrototype: TTMobDummyGnome
  roundStart: true
  maleFirstNames: NamesGnomeFirstMale
  femaleFirstNames: NamesGnomeFirstFemale
  lastNames: NamesGnomeLast
  naming: FirstLast
  defaultBarkVoice: Gnome
  sprites: MobGnomeSprites
  markingLimits: MobHumanMarkingLimits
  skinColoration: HumanToned
  sizeRatio: 3
  minHeight: 0.4
  defaultHeight: 0.6
  maxHeight: 0.8
  minWidth: 0.85
  defaultWidth: 1
  maxWidth: 1.15

